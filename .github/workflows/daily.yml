name: Daily US News Video

on:
  schedule:
    # Roz 3 baar (UTC). IST = UTC+5:30.
    #  09:00 UTC = 14:30 IST | 14:00 UTC = 19:30 IST | 19:30 UTC = 01:00 IST
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Kitni videos"
        default: "2"
      upload:
        description: "YouTube pe upload karo? (true/false)"
        default: "true"

# ek waqt me ek hi run (history file conflicts se bachne ke liye)
concurrency:
  group: usa-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install system deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: 4. Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Videos yahin banti hain. NOTE: --out output ZAROORI hai, warna
      # download ke liye output/ folder khaali reh jata hai.
      - name: 5. Generate + upload videos
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          STOCK_API_KEY:    ${{ secrets.STOCK_API_KEY }}
          HF_TOKEN:         ${{ secrets.HF_TOKEN }}
          TTS_API_KEY:      ${{ secrets.TTS_API_KEY }}
          KHUSHI_BASE_URL:  ${{ secrets.KHUSHI_BASE_URL }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload || 'true' }}
        run: |
          COUNT="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.count || '2' }}"
          python main.py --count "$COUNT" --out output

      - name: 6. Save seen-news history
        if: always()
        run: |
          git config user.name  "usa-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.json 2>/dev/null || true
          git commit -m "chore: update seen-news history [skip ci]" || echo "no changes"
          git push || echo "push skipped"

      # Permanent download link (Releases page). Har run par 'latest-videos'
      # tag update hota hai, isliye ek hi clean link rehta hai.
      - name: 7. Publish videos to Release (permanent download)
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-videos
          name: "Latest US news videos"
          body: "Auto-generated US news videos — run #${{ github.run_number }}. Neeche Assets se download karo."
          files: output/*.mp4
          make_latest: true

      # DOWNLOAD OPTION — ye LAST step hai, isliye workflow khatam hone par hi
      # Actions run page ke 'Artifacts' section me download button aata hai.
      - name: 8. Upload videos as artifact (download after workflow ends)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-run-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 30
